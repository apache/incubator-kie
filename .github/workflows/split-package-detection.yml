# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: Split Package Detection

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Optional: Run manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-split-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn package -Dquickly

      - name: Make script executable
        run: chmod +x ./script/split-packages/check-split-packages.sh

      - name: Run split package detection
        run: ./script/split-packages/check-split-packages.sh

      - name: Upload results as artifact if failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: split-package-report
          path: |
            script/split-packages/check-split-packages.sh
            # You could save the output to a file and include that too
