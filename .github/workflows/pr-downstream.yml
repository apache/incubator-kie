name: 'CI :: Examples'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '**/.gitignore'
      - '**.md'
      - '**.adoc'
      - '*.txt'
      - 'docsimg/**'
      - '.ci/jenkins/**'

jobs:
  kie-examples:
    name: '${{ matrix.examples-subfolder }}'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-downstream-${{ matrix.examples-subfolder }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 180
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        examples-subfolder:
          - kogito-quarkus-examples
          - kogito-springboot-examples
          - gradle-examples

    steps:
      - name: 'SETUP :: Free disk space'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 'SETUP :: Checkout incubator-kie'
        uses: actions/checkout@v7

      - name: 'SETUP :: Java 17'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: 'SETUP :: Block apache.snapshots Maven repository'
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <mirrors>
              <mirror>
                <id>block-apache-snapshots</id>
                <mirrorOf>apache.snapshots,apache-snapshot-repository</mirrorOf>
                <url>https://repository.apache.org/snapshots/</url>
                <blocked>true</blocked>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: 'BUILD :: Install incubator-kie snapshot'
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs -Denforcer.skip=true -Dcheckstyle.skip=true -Dformatter.skip=true -Darchunit.skip=true install

      - name: 'SETUP :: Checkout incubator-kie-examples'
        uses: actions/checkout@v7
        with:
          repository: apache/incubator-kie-examples
          path: ../kie-examples

      - name: 'BUILD :: ${{ matrix.examples-subfolder }}'
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress -fae -pl :kogito-examples -am install -DskipTests -DskipITs -Denforcer.skip=true -f ../kie-examples/pom.xml
          mvn --batch-mode --no-transfer-progress -fae -f ../kie-examples/${{ matrix.examples-subfolder }}/pom.xml install dependency:tree -DoutputFile=mvn_dependency_tree_${{ matrix.examples-subfolder }}_ubuntu-latest.txt

      - name: 'REPORT :: Upload dependency trees'
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-trees-logs_${{ matrix.examples-subfolder }}_ubuntu-latest
          path: '../kie-examples/${{ matrix.examples-subfolder }}/**/mvn_dependency_tree_${{ matrix.examples-subfolder }}_ubuntu-latest.txt'
